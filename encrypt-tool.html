<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Encryptor</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #121214; color: #e1e1e6; padding: 2rem; }
        textarea, input { width: 100%; margin-bottom: 1rem; background: #202024; color: #fff; border: 2px solid #29292e; padding: .75rem; border-radius: 6px; box-sizing: border-box; font-size: 1rem; }
        button { background: #04d361; color: #121214; border: none; padding: .75rem 1.5rem; font-weight: bold; border-radius: 6px; cursor: pointer; }
        pre { background: #202024; padding: 1rem; border-radius: 8px; white-space: pre-wrap; word-break: break-all; }
        .note { color: #a8a8b3; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <h1>Encrypt Dashboard HTML</h1>
    <p class="note">请通过 localhost 或 HTTPS 打开本页面，否则 Web Crypto 可能不可用。</p >
    
    <label>Password</label>
    <input type="password" id="pwd" placeholder="设置一个强密码">
    
    <label>Dashboard HTML</label>
    <textarea id="html" rows="12" placeholder="粘贴要加密的后台 HTML 片段"></textarea>
    
    <button onclick="generate()">Generate Encrypted Payload</button>
    
    <pre id="out">生成的加密 payload 会显示在这里...</pre>

    <script>
        async function generate() {
            const password = document.getElementById('pwd').value;
            const html = document.getElementById('html').value;
            const out = document.getElementById('out');
            
            if (!password || !html) {
                out.textContent = '请输入密码和需要加密的 Dashboard HTML。';
                return;
            }

            try {
                const enc = new TextEncoder();
                const salt = crypto.getRandomValues(new Uint8Array(16));
                const iv = crypto.getRandomValues(new Uint8Array(12));

                const keyMaterial = await crypto.subtle.importKey(
                    'raw',
                    enc.encode(password),
                    'PBKDF2',
                    false,
                    ['deriveKey']
                );

                const key = await crypto.subtle.deriveKey(
                    { name: 'PBKDF2', salt: salt, iterations: 310000, hash: 'SHA-256' },
                    keyMaterial,
                    { name: 'AES-GCM', length: 256 },
                    false,
                    ['encrypt', 'decrypt']
                );

                const ciphertext = await crypto.subtle.encrypt(
                    { name: 'AES-GCM', iv: iv },
                    key,
                    enc.encode(html)
                );

                const payload = {
                    salt: bufToBase64(salt),
                    iv: bufToBase64(iv),
                    data: bufToBase64(ciphertext)
                };

                out.textContent = JSON.stringify(payload);
            } catch (e) {
                out.textContent = 'Error: ' + e.message + ' - 请确认已通过 localhost 或 HTTPS 访问。';
                console.error(e);
            }
        }

        function bufToBase64(buf) {
            const bytes = new Uint8Array(buf);
            let binary = '';
            for (const b of bytes) binary += String.fromCharCode(b);
            return btoa(binary);
        }
    </script>
</body>
</html>
